name: Tests

on:
  push:
    branches: [ main, feat/*, dev ]
  pull_request:
      branches: [ main, feat/*, dev ]

jobs:
  test:
    name: Slow
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v3
        with:
          go-version: 1.23.6
        id: go

      - name: Check out code
        uses: actions/checkout@v3

      - name: Get dependencies
        run: |
          go get -v -t -d ./...
      - name: Slow tests
        run: make slow-tests
