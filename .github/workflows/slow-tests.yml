name: Tests

on:
  push:
    branches: [ main, feat/*, dev-test ]
  pull_request:
      branches: [ main, feat/*, dev-test ]

jobs:
  test:
    name: Slow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.0
        id: go

      - name: Get dependencies
        run: |
          go get -v -t -d ./...
      - name: Slow tests
        run: make slow-tests
