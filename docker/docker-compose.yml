services:
 chain-simulator:
  image: terradharitri/chainsimulator:9011e0d
  ports:
    - 8085:8085
  volumes:
    - "../scripts:/docker/scripts"
  entrypoint: "./chainsimulator -log-level *:INFO"

 sui:
  image: mysten/sui-tools:testnet
  ports:
    - "9000:9000"  # Sui RPC port
    - "9123:9123"  # Sui faucet port
  command: >
   sui start --with-faucet --force-regenesis
